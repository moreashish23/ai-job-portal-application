server:
  port: 8761

spring:
  application:
    name: job-portal-service-registry

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server must NOT register itself or try to fetch its own registry
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Development setting: disable self-preservation so stale instances
    # are evicted quickly. Re-enable (set to true) in production.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never